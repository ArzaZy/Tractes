<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · TracLabs</title>
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f8fafc; background:
          radial-gradient(40rem 30rem at 10% -5%, rgba(59,130,246,.35), transparent 60%),
          radial-gradient(36rem 28rem at 95% 100%, rgba(139,92,246,.28), transparent 60%), #09090d;
      }
      main {
        max-width: 24rem; text-align: center; padding: 2rem 1.5rem; border-radius: 1.5rem;
        background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
        border: 1px solid rgba(255,255,255,.18);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 20px 50px -20px rgba(0,0,0,.6);
        -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
      }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.25rem; color: #a3b0c7; line-height: 1.5; }
      button {
        min-height: 2.75rem; padding: .5rem 1.25rem; border-radius: .9rem; border: 1px solid rgba(255,255,255,.28);
        color: #fff; font: inherit; font-weight: 600; cursor: pointer;
        background: linear-gradient(180deg, #6ba0ff, #2f6df0);
      }
      button:focus-visible { outline: 2px solid #b69cfc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>TracLabs needs a connection to load projects. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
