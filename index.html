<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TracTasks</title>
<meta name="description" content="TracTasks — daftar tugas yang tenang, cepat, dan terasa premium.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  /* Terapkan tema sebelum render agar tidak berkedip */
  (function () {
    var t = null;
    try { t = localStorage.getItem('tractasks.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<style>
/* ==========================================================================
   TracTasks — Design tokens
   Ubah warna, radius, atau easing di sini untuk menyesuaikan seluruh tampilan.
   ========================================================================== */
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --radius-lg: 18px;
  --radius-md: 12px;
  --maxw: 640px;
}

[data-theme="dark"] {
  --bg: #09090b;
  --surface: #111114;
  --surface-2: #17171b;
  --hover: rgba(255, 255, 255, .025);
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .18);
  --text: #f4f4f5;
  --muted: #8b8b95;
  --faint: #55555e;
  --accent: #8b5cf6;
  --accent-hover: #9d75f8;
  --accent-soft: rgba(139, 92, 246, .14);
  --accent-ring: rgba(139, 92, 246, .35);
  --grid: rgba(255, 255, 255, .035);
  --glow: rgba(139, 92, 246, .16);
  --toast-bg: #f4f4f5;
  --toast-text: #09090b;
  --toast-accent: #6d28d9;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --hover: rgba(0, 0, 0, .02);
  --line: rgba(0, 0, 0, .08);
  --line-strong: rgba(0, 0, 0, .2);
  --text: #09090b;
  --muted: #71717a;
  --faint: #a1a1aa;
  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-soft: rgba(124, 58, 237, .09);
  --accent-ring: rgba(124, 58, 237, .28);
  --grid: rgba(0, 0, 0, .04);
  --glow: rgba(124, 58, 237, .10);
  --toast-bg: #09090b;
  --toast-text: #fafafa;
  --toast-accent: #c4b5fd;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -14px rgba(24,24,40,.14);
  color-scheme: light;
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  font-feature-settings: 'cv11', 'ss03';
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color .4s var(--ease), color .4s var(--ease);
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
svg { display: block; }
::selection { background: var(--accent-ring); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Latar: grid halus + cahaya ungu di atas */
body::before {
  content: '';
  position: fixed; inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 50% 0%, var(--glow), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 56px 56px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%);
}

.app {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 20px max(48px, env(safe-area-inset-bottom));
}

/* ==========================================================================
   Header
   ========================================================================== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
  animation: rise .7s var(--ease) both;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #a78bfa 0%, #7c3aed 55%, #5b21b6 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.14) inset, 0 6px 16px -4px rgba(124,58,237,.55);
}
.brand-mark svg { width: 16px; height: 16px; }
.brand-name { font-weight: 650; font-size: 16px; letter-spacing: -.03em; }
.brand-name span { color: var(--muted); font-weight: 500; }

.theme-toggle {
  position: relative;
  width: 38px; height: 38px;
  border-radius: 999px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  transition: color .2s, border-color .2s, transform .25s var(--ease-spring), background-color .4s;
}
.theme-toggle:hover { color: var(--text); border-color: var(--line-strong); }
.theme-toggle:active { transform: scale(.92); }
.theme-toggle svg {
  position: absolute; width: 17px; height: 17px;
  transition: transform .5s var(--ease), opacity .3s;
}
[data-theme="dark"] .ico-sun  { transform: rotate(0) scale(1); opacity: 1; }
[data-theme="dark"] .ico-moon { transform: rotate(-90deg) scale(.4); opacity: 0; }
[data-theme="light"] .ico-sun  { transform: rotate(90deg) scale(.4); opacity: 0; }
[data-theme="light"] .ico-moon { transform: rotate(0) scale(1); opacity: 1; }

/* ==========================================================================
   Hero
   ========================================================================== */
.hero { padding: 36px 0 28px; animation: rise .8s .05s var(--ease) both; }
.eyebrow {
  margin: 0 0 12px;
  font-size: 12.5px; font-weight: 500;
  letter-spacing: .02em;
  color: var(--accent);
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.hero h1 {
  margin: 0;
  font-size: clamp(34px, 8vw, 48px);
  line-height: 1.05;
  font-weight: 650;
  letter-spacing: -.045em;
}
.hero h1 .dim { color: var(--faint); }
.hero p {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 16px;
  letter-spacing: -.01em;
}

/* ==========================================================================
   Progress
   ========================================================================== */
.progress {
  display: flex; align-items: center; gap: 18px;
  padding: 16px 18px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: background-color .4s, border-color .4s;
  animation: rise .8s .1s var(--ease) both;
}
.ring { position: relative; width: 60px; height: 60px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--line); }
.ring .bar {
  stroke: url(#ringGrad);
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  transition: stroke-dashoffset .9s var(--ease);
}
.ring-num {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 14px; font-weight: 600;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.ring-num small { font-size: 9px; font-weight: 500; color: var(--muted); margin-left: 1px; align-self: center; }
.ring-num-inner { display: flex; align-items: baseline; }
.progress-text { min-width: 0; flex: 1; }
.progress-title { margin: 0; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.progress-sub { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.progress.complete .ring .bar { filter: drop-shadow(0 0 6px var(--accent-ring)); }

/* ==========================================================================
   Composer
   ========================================================================== */
.composer {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 7px 7px 16px;
  margin-bottom: 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: border-color .25s, box-shadow .25s, background-color .4s;
  animation: rise .8s .15s var(--ease) both;
}
.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow);
}
.composer.shake { animation: shake .4s var(--ease); }
.composer-icon { color: var(--faint); width: 18px; height: 18px; flex: none; transition: color .25s, transform .4s var(--ease); }
.composer:focus-within .composer-icon { color: var(--accent); transform: rotate(90deg); }
.composer input {
  flex: 1; min-width: 0;
  height: 40px;
  border: 0; outline: 0; background: transparent;
  font-size: 16px; /* mencegah zoom otomatis di iOS */
  letter-spacing: -.01em;
}
.composer input::placeholder { color: var(--faint); }
.kbd {
  display: none;
  height: 22px; min-width: 22px; padding: 0 6px;
  align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 6px;
  font-size: 11.5px; font-weight: 500; color: var(--muted);
  background: var(--surface-2);
  transition: opacity .2s;
}
.composer:focus-within .kbd { opacity: 0; }
@media (hover: hover) and (min-width: 640px) { .kbd { display: inline-flex; } }

.add-btn {
  width: 42px; height: 42px; flex: none;
  border-radius: 12px;
  display: grid; place-items: center;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 14px -6px var(--accent);
  opacity: .45;
  transition: opacity .25s, transform .25s var(--ease-spring), background-color .2s;
}
.add-btn svg { width: 18px; height: 18px; }
.composer.ready .add-btn { opacity: 1; }
.add-btn:hover { background: var(--accent-hover); }
.add-btn:active { transform: scale(.9); }

/* ==========================================================================
   Toolbar (filter + clear)
   ========================================================================== */
.toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 12px;
  animation: rise .8s .2s var(--ease) both;
}
.segmented {
  position: relative;
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  transition: background-color .4s;
}
.seg-indicator {
  position: absolute; top: 3px; bottom: 3px; left: 0;
  width: 0;
  border-radius: 9px;
  background: var(--surface-2);
  box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.12);
  transition: transform .45s var(--ease), width .45s var(--ease), background-color .4s;
  pointer-events: none;
}
.seg-btn {
  position: relative; z-index: 1;
  height: 32px; padding: 0 12px;
  border-radius: 9px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 500;
  color: var(--muted);
  transition: color .2s;
}
.seg-btn:hover { color: var(--text); }
.seg-btn[aria-selected="true"] { color: var(--text); }
.seg-count {
  font-size: 11.5px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
  transition: color .2s;
}
.seg-btn[aria-selected="true"] .seg-count { color: var(--accent); }

.clear-btn {
  height: 36px; padding: 0 12px;
  border-radius: 10px;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13.5px; font-weight: 500;
  color: var(--muted);
  transition: color .2s, background-color .2s, opacity .25s, transform .2s var(--ease);
}
.clear-btn svg { width: 15px; height: 15px; }
.clear-btn:hover { color: var(--text); background: var(--accent-soft); }
.clear-btn:active { transform: scale(.96); }
.clear-btn:disabled { opacity: .35; pointer-events: none; }

/* ==========================================================================
   List
   ========================================================================== */
.list-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: background-color .4s, border-color .4s;
  animation: rise .8s .25s var(--ease) both;
}
.list { list-style: none; margin: 0; padding: 0; }

.item {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows .35s var(--ease), opacity .3s var(--ease), transform .35s var(--ease);
}
.item + .item { border-top: 1px solid var(--line); }
.item-clip { min-height: 0; overflow: hidden; }
.item.enter { animation: itemIn .5s var(--ease) both; }
.item.leaving {
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateX(14px);
  pointer-events: none;
  border-top-color: transparent;
}

.item-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 15px 14px 15px 16px;
  transition: background-color .2s;
}
.item:hover .item-row { background: var(--hover); }

/* Checkbox kustom */
.check {
  position: relative;
  width: 22px; height: 22px; margin-top: 1px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center;
  color: #fff;
  transition: background-color .25s var(--ease), border-color .25s, transform .2s var(--ease), box-shadow .25s;
}
/* area sentuh lebih besar di HP */
.check::after { content: ''; position: absolute; inset: -11px; }
.check:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.check:active { transform: scale(.88); }
.check svg { width: 13px; height: 13px; }
.check path {
  fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset .35s .05s var(--ease);
}
.item.done .check { background: var(--accent); border-color: var(--accent); animation: pop .4s var(--ease-spring); }
.item.done .check path { stroke-dashoffset: 0; }

.item-main { flex: 1; min-width: 0; padding-top: 1px; }
.item-text {
  display: inline;
  font-size: 15.5px; letter-spacing: -.012em; line-height: 1.45;
  overflow-wrap: anywhere;
  cursor: text;
  background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0% 1.5px;
  transition: color .3s, background-size .4s var(--ease);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.item.done .item-text { color: var(--muted); background-size: 100% 1.5px; }
.item-meta { display: block; margin-top: 3px; font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

.edit-input {
  width: 100%;
  height: 34px; margin: -5px 0 -2px;
  padding: 0 10px;
  border: 1px solid var(--accent);
  border-radius: 9px;
  outline: 0;
  background: var(--surface-2);
  box-shadow: 0 0 0 4px var(--accent-soft);
  font-size: 16px; letter-spacing: -.012em;
}
.item.editing .item-text, .item.editing .item-meta { display: none; }

.item-actions { display: flex; gap: 2px; margin: -4px 0; opacity: 0; transform: translateX(4px); transition: opacity .2s, transform .3s var(--ease); }
.item:hover .item-actions, .item:focus-within .item-actions, .item.editing .item-actions { opacity: 1; transform: none; }
@media (hover: none) { .item-actions { opacity: 1; transform: none; } }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: 9px;
  display: grid; place-items: center;
  color: var(--faint);
  transition: color .2s, background-color .2s, transform .2s var(--ease);
}
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { color: var(--text); background: var(--surface-2); }
.icon-btn.del:hover { color: #f43f5e; background: rgba(244, 63, 94, .1); }
.icon-btn:active { transform: scale(.9); }

/* Empty state */
.empty { padding: 56px 24px 52px; text-align: center; animation: fadeIn .6s var(--ease) both; }
.empty-art {
  width: 52px; height: 52px; margin: 0 auto 18px;
  border-radius: 16px;
  display: grid; place-items: center;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-ring);
}
.empty-art svg { width: 22px; height: 22px; }
.empty h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
.empty p { margin: 6px auto 0; max-width: 280px; color: var(--muted); font-size: 14px; }

.footnote {
  margin-top: 28px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--faint); font-size: 12.5px;
  animation: rise .8s .3s var(--ease) both;
}
.footnote svg { width: 13px; height: 13px; }

/* ==========================================================================
   Toast
   ========================================================================== */
.toast-wrap {
  position: fixed; left: 0; right: 0;
  bottom: max(20px, env(safe-area-inset-bottom));
  display: flex; justify-content: center;
  padding: 0 16px;
  pointer-events: none;
  z-index: 50;
}
.toast {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 10px 10px 18px;
  border-radius: 14px;
  background: var(--toast-bg); color: var(--toast-text);
  font-size: 14px; font-weight: 500;
  box-shadow: 0 18px 40px -12px rgba(0,0,0,.45);
  pointer-events: auto;
  animation: toastIn .5s var(--ease-spring) both;
}
.toast.out { animation: toastOut .3s var(--ease) both; }
.toast button {
  height: 30px; padding: 0 12px;
  border-radius: 9px;
  font-weight: 600; font-size: 13.5px;
  color: var(--toast-accent);
  transition: background-color .2s;
}
.toast button:hover { background: rgba(124, 58, 237, .14); }

/* ==========================================================================
   Animations
   ========================================================================== */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes itemIn { from { opacity: 0; transform: translateY(-8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(12px) scale(.96); } }

/* ==========================================================================
   Responsif
   ========================================================================== */
@media (max-width: 520px) {
  .app { padding-left: 16px; padding-right: 16px; }
  .hero { padding: 24px 0 22px; }
  .toolbar { flex-wrap: wrap; }
  .segmented { flex: 1; }
  .seg-btn { flex: 1; justify-content: center; padding: 0 8px; }
  .clear-btn { margin-left: auto; }
  .item-row { padding: 14px 8px 14px 14px; gap: 12px; }
}
@media (min-width: 900px) {
  .hero { padding-top: 56px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>
<main class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <span class="brand-name">Trac<span>Tasks</span></span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ganti tema" title="Ganti tema">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <section class="hero">
    <p class="eyebrow" id="dateLabel">&nbsp;</p>
    <h1 id="greeting">Halo.</h1>
    <p id="subtitle" aria-live="polite">&nbsp;</p>
  </section>

  <section class="progress" id="progress" aria-label="Progres tugas">
    <div class="ring">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c4b5fd"/>
            <stop offset="1" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="24" cy="24" r="21" pathLength="100"/>
        <circle class="bar" id="ringBar" cx="24" cy="24" r="21" pathLength="100"/>
      </svg>
      <div class="ring-num"><span class="ring-num-inner"><span id="pctNum">0</span><small>%</small></span></div>
    </div>
    <div class="progress-text">
      <p class="progress-title" id="progressTitle">Belum ada tugas</p>
      <p class="progress-sub" id="progressSub">Tambahkan tugas pertamamu.</p>
    </div>
  </section>

  <form class="composer" id="composer" autocomplete="off">
    <svg class="composer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <input id="taskInput" type="text" placeholder="Apa yang ingin kamu selesaikan?" maxlength="140" aria-label="Tugas baru" enterkeyhint="done">
    <span class="kbd" aria-hidden="true" title="Tekan / untuk fokus">/</span>
    <button class="add-btn" type="submit" aria-label="Tambah tugas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <div class="toolbar">
    <div class="segmented" id="filters" role="tablist" aria-label="Filter tugas">
      <span class="seg-indicator" id="segIndicator"></span>
      <button class="seg-btn" role="tab" data-filter="all" aria-selected="true">Semua <span class="seg-count" id="cntAll">0</span></button>
      <button class="seg-btn" role="tab" data-filter="active" aria-selected="false">Aktif <span class="seg-count" id="cntActive">0</span></button>
      <button class="seg-btn" role="tab" data-filter="done" aria-selected="false">Selesai <span class="seg-count" id="cntDone">0</span></button>
    </div>
    <button class="clear-btn" id="clearDone" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>
      Hapus selesai
    </button>
  </div>

  <section class="list-card">
    <ul class="list" id="list" aria-label="Daftar tugas"></ul>
    <div id="emptyHost"></div>
  </section>

  <p class="footnote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Tersimpan otomatis di perangkat ini. Klik dua kali pada tugas untuk mengedit.
  </p>
</main>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
/* ==========================================================================
   TracTasks — Logika aplikasi
   ========================================================================== */

/* ---- Konfigurasi (mudah diubah) ---- */
const CONFIG = {
  STORAGE_KEY: 'tractasks.v1',
  THEME_KEY: 'tractasks.theme',
  MAX_LEN: 140,
  UNDO_MS: 5500,
  LOCALE: 'id-ID',
};

/* ---- Ikon ---- */
const ICON = {
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  edit:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  list:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  bolt:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  done:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',
};

/* ---- Elemen DOM ---- */
const $ = (id) => document.getElementById(id);
const dom = {
  list: $('list'), emptyHost: $('emptyHost'),
  form: $('composer'), input: $('taskInput'),
  filters: $('filters'), indicator: $('segIndicator'),
  clear: $('clearDone'),
  cntAll: $('cntAll'), cntActive: $('cntActive'), cntDone: $('cntDone'),
  greeting: $('greeting'), subtitle: $('subtitle'), dateLabel: $('dateLabel'),
  progress: $('progress'), ringBar: $('ringBar'), pctNum: $('pctNum'),
  progressTitle: $('progressTitle'), progressSub: $('progressSub'),
  toastWrap: $('toastWrap'), themeToggle: $('themeToggle'),
};

/* ---- State ---- */
let tasks = load();
let filter = 'all';
const nodes = new Map();      // id -> <li>
let undoSnapshot = null;
let toastTimer = null;
let shownPct = 0;

/* ==========================================================================
   Penyimpanan
   ========================================================================== */
function load() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (raw === null) return seed();
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data.filter(t => t && typeof t.text === 'string') : [];
  } catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
}
/* Contoh tugas untuk pengguna baru */
function seed() {
  const now = Date.now();
  return [
    { id: uid(), text: 'Selamat datang di TracTasks', done: true,  createdAt: now - 60000, completedAt: now - 30000 },
    { id: uid(), text: 'Klik dua kali pada tugas untuk mengeditnya', done: false, createdAt: now - 40000, completedAt: null },
    { id: uid(), text: 'Tekan / untuk langsung menulis tugas baru', done: false, createdAt: now - 20000, completedAt: null },
  ];
}
function uid() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

/* ==========================================================================
   Format tanggal & sapaan
   ========================================================================== */
const timeFmt = new Intl.DateTimeFormat(CONFIG.LOCALE, { hour: '2-digit', minute: '2-digit' });
const dayFmt  = new Intl.DateTimeFormat(CONFIG.LOCALE, { day: 'numeric', month: 'short' });

function stamp(ts) {
  const d = new Date(ts), now = new Date();
  const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((startOf(now) - startOf(d)) / 86400000);
  const time = timeFmt.format(d);
  if (diff === 0) return 'Hari ini, ' + time;
  if (diff === 1) return 'Kemarin, ' + time;
  return dayFmt.format(d) + ', ' + time;
}
function greetingFor(h) {
  if (h < 4)  return 'Selamat malam';
  if (h < 11) return 'Selamat pagi';
  if (h < 15) return 'Selamat siang';
  if (h < 18) return 'Selamat sore';
  return 'Selamat malam';
}
function renderHeader() {
  const now = new Date();
  dom.dateLabel.textContent = new Intl.DateTimeFormat(CONFIG.LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }).format(now);
  dom.greeting.innerHTML = '';
  dom.greeting.append(greetingFor(now.getHours()), Object.assign(document.createElement('span'), { className: 'dim', textContent: '.' }));
}

/* ==========================================================================
   Aksi
   ========================================================================== */
function snapshot() { undoSnapshot = JSON.parse(JSON.stringify(tasks)); }

function addTask(text) {
  tasks.unshift({ id: uid(), text, done: false, createdAt: Date.now(), completedAt: null });
  save(); render();
}
function toggleTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  save(); render();
}
function deleteTask(id) {
  snapshot();
  tasks = tasks.filter(x => x.id !== id);
  save(); render();
  showToast('Tugas dihapus');
}
function clearDone() {
  const n = tasks.filter(t => t.done).length;
  if (!n) return;
  snapshot();
  tasks = tasks.filter(t => !t.done);
  save(); render();
  showToast(n + (n === 1 ? ' tugas selesai dihapus' : ' tugas selesai dihapus'));
}
function setFilter(f) {
  filter = f;
  dom.filters.querySelectorAll('.seg-btn').forEach(b => b.setAttribute('aria-selected', String(b.dataset.filter === f)));
  render();
}

/* ---- Edit inline ---- */
function startEdit(id) {
  const li = nodes.get(id);
  const t = tasks.find(x => x.id === id);
  if (!li || !t || li.classList.contains('editing')) return;

  const main = li.querySelector('.item-main');
  const input = document.createElement('input');
  input.className = 'edit-input';
  input.value = t.text;
  input.maxLength = CONFIG.MAX_LEN;
  input.setAttribute('aria-label', 'Edit tugas');
  li.classList.add('editing');
  main.prepend(input);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  let finished = false;
  const finish = (commit) => {
    if (finished) return;
    finished = true;
    const val = input.value.trim();
    input.remove();
    li.classList.remove('editing');
    if (commit && val && val !== t.text) {
      t.text = val;
      save();
      render();
    }
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

/* ==========================================================================
   Render
   ========================================================================== */
function createNode(t) {
  const li = document.createElement('li');
  li.className = 'item enter';
  li.dataset.id = t.id;
  li.innerHTML =
    '<div class="item-clip"><div class="item-row">' +
      '<button class="check" type="button" role="checkbox" aria-checked="false" aria-label="Tandai selesai">' + ICON.check + '</button>' +
      '<div class="item-main"><span class="item-text"></span><span class="item-meta"></span></div>' +
      '<div class="item-actions">' +
        '<button class="icon-btn edit" type="button" aria-label="Edit tugas">' + ICON.edit + '</button>' +
        '<button class="icon-btn del" type="button" aria-label="Hapus tugas">' + ICON.trash + '</button>' +
      '</div>' +
    '</div></div>';
  li.addEventListener('animationend', (e) => { if (e.animationName === 'itemIn') li.classList.remove('enter'); });
  return li;
}
function updateNode(li, t) {
  li.classList.toggle('done', t.done);
  const check = li.querySelector('.check');
  check.setAttribute('aria-checked', String(t.done));
  check.setAttribute('aria-label', t.done ? 'Tandai belum selesai' : 'Tandai selesai');
  const text = li.querySelector('.item-text');
  if (text.textContent !== t.text) text.textContent = t.text;
  li.querySelector('.item-meta').textContent = t.done && t.completedAt ? 'Selesai ' + stamp(t.completedAt).toLowerCase() : 'Dibuat ' + stamp(t.createdAt).toLowerCase();
}
function removeNode(li) {
  li.classList.add('leaving');
  let gone = false;
  const kill = () => { if (!gone) { gone = true; li.remove(); } };
  li.addEventListener('transitionend', (e) => { if (e.target === li && e.propertyName === 'grid-template-rows') kill(); });
  setTimeout(kill, 450);
}

function render() {
  const visible = tasks.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
  const visibleIds = new Set(visible.map(t => t.id));

  /* keluarkan yang tidak lagi tampil */
  for (const [id, li] of nodes) {
    if (!visibleIds.has(id)) { removeNode(li); nodes.delete(id); }
  }

  /* tambah/perbarui dan jaga urutan tanpa memindahkan node yang sudah benar */
  let prev = null;
  visible.forEach(t => {
    let li = nodes.get(t.id);
    if (!li) { li = createNode(t); nodes.set(t.id, li); }
    updateNode(li, t);

    let expected = prev ? prev.nextElementSibling : dom.list.firstElementChild;
    while (expected && expected.classList.contains('leaving')) expected = expected.nextElementSibling;
    if (expected !== li) dom.list.insertBefore(li, expected);
    prev = li;
  });

  renderEmpty(visible.length);
  renderStats();
  requestAnimationFrame(positionIndicator);
}

function renderEmpty(count) {
  dom.emptyHost.innerHTML = '';
  if (count > 0) return;
  const copy = {
    all:    { icon: ICON.list, title: 'Belum ada tugas', text: 'Tulis satu hal kecil di atas. Mulai dari yang paling mudah.' },
    active: { icon: ICON.bolt, title: 'Tidak ada tugas aktif', text: tasks.length ? 'Semua beres. Saatnya istirahat sejenak.' : 'Tambahkan tugas baru untuk memulai.' },
    done:   { icon: ICON.done, title: 'Belum ada yang selesai', text: 'Tandai tugas dengan lingkaran di sebelah kiri.' },
  }[filter];
  const box = document.createElement('div');
  box.className = 'empty';
  box.innerHTML = '<div class="empty-art">' + copy.icon + '</div><h3></h3><p></p>';
  box.querySelector('h3').textContent = copy.title;
  box.querySelector('p').textContent = copy.text;
  dom.emptyHost.appendChild(box);
}

function renderStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const active = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;

  dom.cntAll.textContent = total;
  dom.cntActive.textContent = active;
  dom.cntDone.textContent = done;
  dom.clear.disabled = done === 0;

  dom.ringBar.style.strokeDashoffset = String(100 - pct);
  dom.progress.classList.toggle('complete', total > 0 && pct === 100);
  tweenNumber(dom.pctNum, shownPct, pct);
  shownPct = pct;

  if (!total) {
    dom.progressTitle.textContent = 'Belum ada tugas';
    dom.progressSub.textContent = 'Tambahkan tugas pertamamu.';
    dom.subtitle.textContent = 'Mulai dengan satu tugas kecil.';
  } else if (!active) {
    dom.progressTitle.textContent = 'Semua selesai';
    dom.progressSub.textContent = done + ' dari ' + total + ' tugas tuntas. Kerja bagus.';
    dom.subtitle.textContent = 'Semua tugas selesai. Nikmati harimu.';
  } else {
    dom.progressTitle.textContent = done + ' dari ' + total + ' tugas selesai';
    dom.progressSub.textContent = active + ' tugas tersisa.';
    dom.subtitle.textContent = active + ' tugas menunggu untuk diselesaikan.';
  }
}

function tweenNumber(el, from, to) {
  if (from === to) { el.textContent = to; return; }
  const start = performance.now(), dur = 700;
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function positionIndicator() {
  const active = dom.filters.querySelector('[aria-selected="true"]');
  if (!active) return;
  dom.indicator.style.width = active.offsetWidth + 'px';
  dom.indicator.style.transform = 'translateX(' + active.offsetLeft + 'px)';
}

/* ==========================================================================
   Toast + urungkan
   ========================================================================== */
function showToast(message) {
  clearTimeout(toastTimer);
  dom.toastWrap.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast';
  const msg = document.createElement('span'); msg.textContent = message;
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Urungkan';
  btn.addEventListener('click', () => {
    if (undoSnapshot) { tasks = undoSnapshot; undoSnapshot = null; save(); render(); }
    hideToast();
  });
  el.append(msg, btn);
  dom.toastWrap.appendChild(el);
  toastTimer = setTimeout(hideToast, CONFIG.UNDO_MS);
}
function hideToast() {
  clearTimeout(toastTimer);
  const el = dom.toastWrap.firstElementChild;
  if (!el) return;
  el.classList.add('out');
  setTimeout(() => el.remove(), 300);
}

/* ==========================================================================
   Tema
   ========================================================================== */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#09090b' : '#fafafa');
  try { localStorage.setItem(CONFIG.THEME_KEY, t); } catch (e) {}
}
dom.themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ==========================================================================
   Event
   ========================================================================== */
dom.form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = dom.input.value.trim();
  if (!text) {
    dom.form.classList.remove('shake'); void dom.form.offsetWidth; dom.form.classList.add('shake');
    dom.input.focus();
    return;
  }
  if (filter === 'done') setFilter('all');
  addTask(text);
  dom.input.value = '';
  dom.form.classList.remove('ready');
  dom.input.focus();
});
dom.input.addEventListener('input', () => dom.form.classList.toggle('ready', dom.input.value.trim().length > 0));
dom.form.addEventListener('animationend', () => dom.form.classList.remove('shake'));

dom.filters.addEventListener('click', (e) => {
  const b = e.target.closest('.seg-btn');
  if (b) setFilter(b.dataset.filter);
});
dom.clear.addEventListener('click', clearDone);

dom.list.addEventListener('click', (e) => {
  const li = e.target.closest('.item'); if (!li || li.classList.contains('leaving')) return;
  const id = li.dataset.id;
  if (e.target.closest('.check')) toggleTask(id);
  else if (e.target.closest('.del')) deleteTask(id);
  else if (e.target.closest('.edit')) startEdit(id);
});
dom.list.addEventListener('dblclick', (e) => {
  const text = e.target.closest('.item-text'); if (!text) return;
  window.getSelection && window.getSelection().removeAllRanges();
  startEdit(text.closest('.item').dataset.id);
});

/* Pintasan: "/" fokus ke input, Esc melepas fokus */
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); dom.input.focus(); }
  else if (e.key === 'Escape' && document.activeElement === dom.input) dom.input.blur();
});

window.addEventListener('resize', positionIndicator);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionIndicator);

/* Sinkronkan antar tab */
window.addEventListener('storage', (e) => {
  if (e.key === CONFIG.STORAGE_KEY) { tasks = load(); render(); }
});

/* ---- Mulai ---- */
renderHeader();
render();
save();
</script>
</body>
</html>
